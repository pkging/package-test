name: Build package-test

on:
  push:
    branches: [ '**' ]
    tags:
      - '*'
  pull_request:
  workflow_dispatch:
    inputs:
      run_upload:
        description: "Also run the Pulp upload job"
        required: false
        type: boolean
        default: false

jobs:
  build:
    uses: pkging/ci-workflows/.github/workflows/package.yml@main
    with:
      ci_workflows_ref: "main"
      runner_labels: '["self-hosted","pkging"]'
      source_event_name: ${{ github.event_name }}
      source_ref_name: ${{ github.ref_name }}
      source_ref_type: ${{ github.ref_type }}
      run_upload: ${{ github.event_name == 'workflow_dispatch' && inputs.run_upload || false }}
      sign_packages: true
      matrix: |
        el9: x86_64
        debian12: x86_64
        ubuntu24: x86_64
    secrets: inherit
