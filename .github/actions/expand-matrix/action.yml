name: Expand Matrix
description: Expands a compact distro and arch matrix into include JSON.

inputs:
  matrix:
    description: Compact YAML matrix
    required: true

outputs:
  matrix:
    description: Expanded JSON matrix
    value: ${{ steps.expand.outputs.matrix }}

runs:
  using: composite
  steps:
    - name: Expand compact matrix
      id: expand
      shell: bash
      run: |
        pip install pyyaml
        python3 << 'EOF'
        import json
        import os
        import yaml

        raw = yaml.safe_load("""${{ inputs.matrix }}""")
        expanded = {"include": []}

        for distro, archs in raw.items():
            if isinstance(archs, str):
                archs = [archs]
            for arch in archs:
                expanded["include"].append({"distro": distro, "arch": arch})

        with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
            f.write(f"matrix={json.dumps(expanded)}\n")
        EOF
